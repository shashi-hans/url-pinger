<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>URL Pinger</title>
    <!-- Indicator styles are off because they would be injected as an inline
         <style> tag, which the Content-Security-Policy blocks. -->
    <meta name="htmx-config" content='{"includeIndicatorStyles":false}' />
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/theme.js" defer></script>
    <script src="/js/drawer.js" defer></script>
    <script src="/vendor/htmx.min.js" defer></script>
  </head>
  <body class="bg-base-200 min-h-screen">
    <header class="navbar sticky top-0 z-40 bg-base-100 border-b border-base-300 px-3 sm:px-5 gap-2">
      <label for="nav-drawer" class="btn btn-square btn-ghost btn-sm lg:hidden"
        aria-label="Open the target form">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
          viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </label>

      <div class="flex-1 min-w-0">
        <span class="text-lg font-bold">URL Pinger</span>
        <span class="hidden sm:inline text-sm opacity-70 ml-2">
          Hits each target on its own interval and records the result.
        </span>
      </div>

      <div hx-get="/ui/me" hx-trigger="load" hx-swap="outerHTML"></div>

      <label class="btn btn-sm btn-ghost gap-2" for="theme-toggle">
        <input id="theme-toggle" class="toggle toggle-sm" type="checkbox" />
        <span id="theme-label">Dark</span>
      </label>
    </header>

    <!-- The three siblings below must stay in this order: the panel and the
         backdrop are revealed by the sibling selectors in app.css. Below the lg
         breakpoint the panel is an off-canvas sheet; from lg up it is a normal
         full-width block sitting under the header. -->
    <input id="nav-drawer" type="checkbox" class="sheet-toggle" />
    <div id="sheet-backdrop"></div>

    <div id="form-panel" class="bg-base-200 p-3 sm:p-5 flex flex-col gap-3">
      <div class="flex items-center justify-between lg:hidden">
        <span class="font-semibold">Target form</span>
        <label for="nav-drawer" class="btn btn-sm btn-ghost">Close</label>
      </div>

      <div id="form-errors"></div>
      <div hx-get="/ui/form" hx-trigger="load" hx-swap="outerHTML"></div>
    </div>

    <main class="w-full px-3 sm:px-5 pb-6 flex flex-col gap-4">
      <section class="flex flex-col gap-3">
        <h2 class="font-semibold text-lg">Targets</h2>
        <div id="target-list" class="grid gap-3 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4"
          hx-get="/ui/targets" hx-trigger="load, every 300s" hx-swap="innerHTML">
          <p class="opacity-60 text-sm">Loading…</p>
        </div>
      </section>

      <section id="detail"></section>

      <footer class="text-xs opacity-60">
        Targets are saved to storage. With Supabase, hits are kept for a
        limited number of days and response previews stay in memory only.
      </footer>
    </main>
  </body>
</html>
